
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shortly — URL Shortener</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .brand {
      text-align: center;
      margin-bottom: 48px;
    }

    .brand h1 {
      font-size: 36px;
      letter-spacing: -1.5px;
      margin-bottom: 12px;
    }

    .brand h1 span {
      color: #34d399;
    }

    .brand p {
      color: #a3a3a3;
      line-height: 1.6;
    }

    .panel {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 28px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 10px;
      color: #d4d4d4;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #363636;
      border-radius: 10px;
      background: #0a0a0a;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #34d399;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #34d399;
      color: #052e23;
      padding: 15px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 24px;
      padding: 18px;
      background: #0b211a;
      border: 1px solid #1b5943;
      border-radius: 12px;
    }

    .result.visible {
      display: block;
    }

    .result-label {
      color: #a7f3d0;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .result a {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      color: #6ee7b7;
      text-decoration: none;
    }

    .copy-button {
      padding: 10px 13px;
      white-space: nowrap;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      color: #fca5a5;
    }

    .message:empty {
      display: none;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: #737373;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .panel {
        padding: 20px;
      }

      .input-row {
        flex-direction: column;
      }

      .input-row button {
        width: 100%;
      }

      .result-row {
        align-items: stretch;
        flex-direction: column;
      }

      .brand h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <h1>shortly<span>.</span></h1>
      <p>Long links, meet their shorter side.</p>
    </header>

    <section class="panel">
      <form id="shorten-form">
        <label for="url-input">Paste your long URL</label>

        <div class="input-row">
          <input
            id="url-input"
            type="url"
            placeholder="https://example.com/your-long-link"
            required
          />
          <button id="shorten-button" type="submit">
            Shorten URL
          </button>
        </div>
      </form>

      <div id="result" class="result" aria-live="polite">
        <p class="result-label">Your shortened URL is ready</p>
        <div class="result-row">
          <a id="short-url" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button id="copy-button" class="copy-button" type="button">
            Copy link
          </button>
        </div>
      </div>

      <p id="message" class="message" role="status"></p>
    </section>

    <footer>Simple links. Less clutter.</footer>
  </main>

  <script>
    const form = document.getElementById("shorten-form");
    const urlInput = document.getElementById("url-input");
    const shortenButton = document.getElementById("shorten-button");
    const result = document.getElementById("result");
    const shortUrlLink = document.getElementById("short-url");
    const copyButton = document.getElementById("copy-button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      result.classList.remove("visible");
      message.textContent = "";
      shortenButton.disabled = true;
      shortenButton.textContent = "Shortening...";

      try {
        const response = await fetch("/api/shorten", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: urlInput.value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.message || "Could not shorten this URL.");
        }

        const shortUrl =
          data.shortUrl ||
          `${window.location.origin}/${data.shortCode}`;

        shortUrlLink.href = shortUrl;
        shortUrlLink.textContent = shortUrl;
        result.classList.add("visible");
      } catch (error) {
        message.textContent =
          error.message || "Something went wrong. Please try again.";
      } finally {
        shortenButton.disabled = false;
        shortenButton.textContent = "Shorten URL";
      }
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(shortUrlLink.href);
        copyButton.textContent = "Copied!";

        setTimeout(() => {
          copyButton.textContent = "Copy link";
        }, 1500);
      } catch {
        message.textContent =
          "Copy failed. Select the link and copy it manually.";
      }
    });
  </script>
</body>
</html>
